name: update-version

run-name: ${{ github.actor }} is updating release version.txt

on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-release:
    name: Update Release Version File
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Create and upload version.txt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="$(gh api "repos/${GH_REPO}/releases/latest" --jq .tag_name)"
          fi
          printf '%s\n' "${RELEASE_TAG#v}" > version.txt
          gh release upload "$RELEASE_TAG" version.txt --clobber

      - name: Git Auto Commit
        uses: stefanzweifel/git-auto-commit-action@v5.0.0
        with:
          branch: main
          commit_message: Automatically updating version.txt
          file_pattern: version.txt
